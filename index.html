<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Температура воды в мире</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(255, 255, 255, 0.85), rgba(245, 249, 255, 0.9)),
                url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
        }

        h1 {
            color: #2a5885;
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 800px;
            width: 100%;
        }

        /* Новый стиль для поиска */
        #search-box {
            width: 98%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            background-color: #f9f9f9;
        }
        
        #suggestions {
            list-style: none;
            padding: 0;
            margin: 5px 0 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
            background: #fff;
        }

        #suggestions li {
            padding: 10px;
            cursor: pointer;
        }

        #suggestions li:hover {
            background-color: #f0f0f0;
        }

        .temperature-display {
            text-align: center;
            padding: 30px 0;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
            color: #2a5885;
        }

        .location {
            font-size: 24px;
            margin-top: 10px;
            color: #555;
        }

        .last-update {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 20px;
        }

        .map-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2a5885;
            text-decoration: none;
        }

        .map-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Температура воды в мире</h1>

        <!-- ЗДЕСЬ ВСТАВЛЯЕМ ПОИСК -->
        <input type="text" id="search-box" placeholder="Введите локацию...">
        <ul id="suggestions"></ul>

        <button id="nearest-water-btn" style="
    width: 100%;
    padding: 12px;
    margin: 15px 0;
    font-size: 16px;
    background: #2a5885;
    border: none;
    border-radius: 6px;
    color: white;
    cursor: pointer;
">Температура ближайшей воды</button>

        <div class="temperature-display">
            <div class="temperature" id="temperature">--°C</div>
            <div class="location" id="location-name">Выберите локацию</div>
        </div>

        <a href="#" id="map-link" class="map-link">Посмотреть на карте</a>

        <div class="last-update" id="last-update">
            Данные обновляются автоматически
        </div>
    </div>

    <script>
        // Функция получения температуры остаётся без изменений
        async function getSeaTemperature(lat, lon) {
            const params = {
                "latitude": lat,
                "longitude": lon,
                "hourly": "sea_surface_temperature"
            };

            try {
                const url = new URL("https://marine-api.open-meteo.com/v1/marine");
                Object.entries(params).forEach(([key, value]) => {
                    url.searchParams.append(key, value);
                });

                const response = await fetch(url);
                if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);

                const data = await response.json();

                if (data.hourly?.sea_surface_temperature) {
                    const temps = data.hourly.sea_surface_temperature;
                    return temps[temps.length - 1];
                }

                return null;
            } catch (error) {
                console.error("Ошибка:", error);
                return null;
            }
        }

        async function reverseGeocode(lat, lon) {
    const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=12&addressdetails=1`;
    const res = await fetch(url, { headers: { 'User-Agent': 'SeaTempApp/1.0' } });
    const data = await res.json();

    let name = data.display_name || "Неизвестное место";
    let typeLabel = "";

    const addr = data.address || {};

    // Попытка определить тип водоёма
    if (addr.ocean) {
        typeLabel = `Океан: ${addr.ocean}`;
    } else if (addr.sea) {
        typeLabel = `Море: ${addr.sea}`;
    } else if (addr.bay) {
        typeLabel = `Залив: ${addr.bay}`;
    } else if (addr.strait) {
        typeLabel = `Пролив: ${addr.strait}`;
    } else if (addr.lake) {
        typeLabel = `Озеро: ${addr.lake}`;
    } else if (addr.river) {
        typeLabel = `Река: ${addr.river}`;
    } else if (addr.water) {
        typeLabel = `Водоём: ${addr.water}`;
    } else {
        // fallback — просто город/регион
        typeLabel = name;
    }

    return {
        label: typeLabel,
        fullName: name
    };
}

        // Находим ближайшую точку на воде (используем NOAA / Copernicus координатную сетку)
async function findNearestWater(lat, lon) {
    // Округляем координаты к морской сетке 0.25 градуса
    const round = (value) => Math.round(value * 4) / 4;

    const candidates = [];
    for (let dLat = -1; dLat <= 1; dLat += 0.25) {
        for (let dLon = -1; dLon <= 1; dLon += 0.25) {
            candidates.push([round(lat + dLat), round(lon + dLon)]);
        }
    }

    // Считаем расстояния → ищем ближайшую точку
    function dist(a, b, c, d) {
        return Math.sqrt((a - c) ** 2 + (b - d) ** 2);
    }

    candidates.sort((a, b) =>
        dist(lat, lon, a[0], a[1]) - dist(lat, lon, b[0], b[1])
    );

    return candidates; // возвращаем список — проверим по очереди
}



        // ======== ПОИСК ЛОКАЦИИ ========
        const searchBox = document.getElementById('search-box');
        const suggestions = document.getElementById('suggestions');
        let currentLocation = null;

        searchBox.addEventListener('input', async function () {
            const query = this.value.trim();
            if (query.length < 3) return; // ждем хотя бы 3 символа

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`;

            const res = await fetch(url, { headers: { 'User-Agent': 'SeaTempApp/1.0' } });
            const data = await res.json();

            suggestions.innerHTML = "";
            data.forEach(place => {
                const li = document.createElement("li");
                li.textContent = place.display_name;
                li.addEventListener("click", async () => {
                    searchBox.value = place.display_name;
                    suggestions.innerHTML = "";

                    const lat = parseFloat(place.lat);
                    const lon = parseFloat(place.lon);

                    const temp = await getSeaTemperature(lat, lon);
                    document.getElementById("temperature").textContent = temp ? `${temp.toFixed(1)}°C` : "Нет данных";
                    document.getElementById("location-name").textContent = place.display_name;

                    // сохраняем текущую локацию для карты
                    currentLocation = { lat, lon, name: place.display_name };
                    document.getElementById("last-update").textContent = `Обновлено: ${new Date().toLocaleTimeString()}`;
                });
                suggestions.appendChild(li);
            });
        });

        // ======== КНОПКА КАРТЫ ========
        const mapLink = document.getElementById('map-link');

mapLink.addEventListener('click', function (e) {
  e.preventDefault();

  if (!currentLocation) {
    alert('Пожалуйста, сначала выберите локацию');
    return;
  }

  const lat = currentLocation.lat;
  const lon = currentLocation.lon;
  const label = currentLocation.name || '';

  openMapForMobile(lat, lon, label);
});

function openMapForMobile(lat, lon, label = '') {
  const latLon = `${lat},${lon}`;
  const encLabel = encodeURIComponent(label);

  const googleWeb = `https://www.google.com/maps/search/?api=1&query=${latLon}`;
  const appleWeb = `https://maps.apple.com/?q=${latLon}`;
  const appleMapsApp = `maps://?q=${latLon}`;
  const geoAndroid = `geo:${latLon}?q=${latLon}(${encLabel})`;
  const comGoogleMapsApp = `comgooglemaps://?q=${latLon}`;

  const ua = navigator.userAgent || '';

  // Универсальная попытка: сначала нативный URI, затем веб-фоллбек
  if (/Android/i.test(ua)) {
    // Попробовать geo: (Android) — ставит маркер точно по координатам
    tryOpenUriWithFallback(geoAndroid, googleWeb);
  } else if (/iPhone|iPad|iPod/i.test(ua)) {
    // iOS: сначала Apple Maps scheme, если не сработает — веб Apple или Google
    tryOpenUriWithFallback(appleMapsApp, appleWeb);
  } else {
    // Десктоп / неизвестное — открыть веб Google Maps
    window.open(googleWeb, '_blank');
  }
}

// Пытаемся перейти на URI; если приложение не сработает, через timeout делаем fallback
function tryOpenUriWithFallback(uri, fallbackUrl) {
  // Для большинства браузеров установка location.href попытается открыть схему.
  // Если схема не поддерживается, через таймаут делаем переход на fallback.
  const start = Date.now();
  const timeout = 700; // ms — достаточно короткий, но даёт приложению шанс
  let handled = false;

  // Создаём невидимый iframe для некоторых старых Android браузеров (опционально)
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  document.body.appendChild(iframe);

  // Пытаемся открыть URI
  try {
    // Для большинства мобильных: location.href работает
    window.location.href = uri;
  } catch (err) {
    // В некоторых окружениях try…catch может не сработать — пробуем iframe
    try { iframe.src = uri; } catch (e) {}
  }

  // fallback через timeout
  setTimeout(() => {
    // Если через timeout прошло — переходим на fallback
    // (если пользователь успел переключиться в приложение — это просто откроет веб-страницу, обычно ничего страшного)
    if (Date.now() - start >= timeout) {
      // Для iOS удобнее открывать maps.apple.com; для остальных — Google
      window.location.href = fallbackUrl;
    }
    // cleanup
    try { document.body.removeChild(iframe); } catch (e) {}
  }, timeout);
}

        document.getElementById("nearest-water-btn").addEventListener("click", async () => {
    try {
        // Получаем геопозицию
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const userLat = pos.coords.latitude;
            const userLon = pos.coords.longitude;

            // Ищем ближайшие точки
            const points = await findNearestWater(userLat, userLon);

            let nearestTemp = null;
            let nearestPoint = null;

            for (let [lat, lon] of points) {
                const temp = await getSeaTemperature(lat, lon);
                if (temp && temp.temperature !== null) {
                    nearestTemp = temp.temperature;
                    nearestPoint = { lat, lon };
                    break;
                }
                // маленькая пауза, чтобы не спамить API
                await new Promise(r => setTimeout(r, 120));
            }

            if (!nearestPoint) {
                document.getElementById("location-name").textContent = "Нет данных по воде рядом";
                document.getElementById("temperature").textContent = "-";
                return;
            }

            // Получаем название водоёма
            const place = await reverseGeocode(nearestPoint.lat, nearestPoint.lon);

            // Выводим в интерфейс
            document.getElementById("location-name").textContent = place.label;
            document.getElementById("temperature").textContent = `${nearestTemp.toFixed(1)}°C`;
            document.getElementById("last-update").textContent = `Обновлено: ${new Date().toLocaleTimeString()}`;

            // Чтобы кнопка "Посмотреть на карте" показывала именно эту точку
            currentLocation = {
                lat: nearestPoint.lat,
                lon: nearestPoint.lon,
                name: place.label
            };

        }, () => alert("Геолокация отключена — включи её."));
    } catch (err) {
        console.error(err);
        alert("Ошибка при определении температуры воды.");
    }
});


    </script>
</body>

</html>
